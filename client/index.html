<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite Browser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="lobby">
        <h2>Lobby</h2>
        <p>Hráči: <span id="playerCount">0</span>/10</p>
        <p>Čekání na zahájení...</p>
    </div>
    <div id="gameUI" style="display: none;">
        <div id="healthBar">
            <div id="healthFill"></div>
        </div>
        <div id="shieldBar">
            <div id="shieldFill"></div>
        </div>
        <div id="weaponPanel">
            <div id="currentWeapon">Assault Rifle</div>
            <div id="ammo">30/30</div>
        </div>
        <div id="buildingPanel" style="display: none;">
            <div class="build-piece selected" data-type="wall">Zed</div>
            <div class="build-piece" data-type="floor">Podlaha</div>
            <div class="build-piece" data-type="ramp">Rampa</div>
            <div class="build-piece" data-type="roof">Střecha</div>
        </div>
        <div id="crosshair">+</div>
        <div id="settingsMenu" style="display: none;">
            <h3>Nastavení</h3>
            <label>Zvuk <input type="checkbox" id="soundToggle" checked></label><br>
            <label>Citlivost myši <input type="range" id="mouseSensitivity" min="0.1" max="2" step="0.1" value="1"></label><br>
            <label>Kvalita grafiky 
                <select id="graphicsQuality">
                    <option value="low">Nízká</option>
                    <option value="medium" selected>Střední</option>
                    <option value="high">Vysoká</option>
                </select>
            </label><br>
            <button id="closeSettings">Zpět</button>
        </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>
    <script type="module" src="game.js"></script>
</body>
</html>
